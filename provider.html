<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provider details | SkillConnect</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #5d6b7a;
    --accent: #1f6feb;
    --line: #e1e6ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 20px;
    font-size: 20px;
    font-weight: 600;
  }
  header a { color: #fff; text-decoration: none; }
  main { max-width: 560px; margin: 28px auto; padding: 0 16px; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--accent); text-decoration: none; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
  }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 600; flex-shrink: 0;
  }
  h1 { margin: 0; font-size: 24px; }
  .service { color: var(--muted); margin-top: 2px; }
  dl { margin: 0; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 140px; text-align: center;
    padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600;
    border: 2px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { color: var(--accent); }
  .error { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>

<header><a href="index.html">SkillConnect</a></header>

<main>
  <a class="back" href="index.html">← Back to all providers</a>
  <div class="card" id="content">
    <p class="error">Loading…</p>
  </div>
</main>

<script>
  // Dummy data (same as database.sql). Baad mein yahan fetch() lagana hai Java backend se.
  const providers = [
    { id: 1,  name: "Ramesh Verma",  service_type: "Electrician", city: "Bhopal",   experience: 8,  phone: "9876500001" },
    { id: 2,  name: "Sunita Yadav",  service_type: "Tutor",       city: "Bhopal",   experience: 5,  phone: "9876500002" },
    { id: 3,  name: "Imran Khan",    service_type: "Plumber",     city: "Indore",   experience: 10, phone: "9876500003" },
    { id: 4,  name: "Deepak Sharma", service_type: "Carpenter",   city: "Bhopal",   experience: 12, phone: "9876500004" },
    { id: 5,  name: "Pooja Patel",   service_type: "Beautician",  city: "Indore",   experience: 4,  phone: "9876500005" },
    { id: 6,  name: "Pushpraj kumar",     service_type: "web developer ",     city: "Jabalpur", experience: 2, phone: "9876500006" },
    { id: 7,  name: "Anita Joshi",   service_type: "Tutor",       city: "Indore",   experience: 6,  phone: "9876500007" },
    { id: 8,  name: "Suresh Kumar",  service_type: "Electrician", city: "Gwalior",  experience: 7,  phone: "9876500008" },
    { id: 9,  name: "Farhan Ali",    service_type: "Plumber",     city: "Bhopal",   experience: 9,  phone: "9876500009" },
    { id: 10, name: "Kavita Singh",  service_type: "Cook",        city: "Bhopal",   experience: 11, phone: "9876500010" }
  ];

  // URL aisa hoga: provider.html?id=3
  const id = parseInt(new URLSearchParams(location.search).get("id"), 10) || 6;
  const p = providers.find(x => x.id === id);
  const box = document.getElementById("content");

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  if (!p) {
    box.innerHTML = '<p class="error">Provider not found.</p>';
  } else {
    document.title = p.name + " | SkillConnect";
    box.innerHTML = `
      <div class="top">
        <div class="avatar">${esc(p.name.charAt(0))}</div>
        <div>
          <h1>${esc(p.name)}</h1>
          <div class="service">${esc(p.service_type)}</div>
        </div>
      </div>
      <dl>
        <div class="row"><dt>Service</dt><dd>${esc(p.service_type)}</dd></div>
        <div class="row"><dt>City</dt><dd>${esc(p.city)}</dd></div>
        <div class="row"><dt>Experience</dt><dd>${p.experience} years</dd></div>
        <div class="row"><dt>Phone</dt><dd>${esc(p.phone)}</dd></div>
      </dl>
      <div class="actions">
        <a class="btn primary" href="tel:${esc(p.phone)}">Call now</a>
        <a class="btn secondary" href="https://wa.me/91${esc(p.phone)}" target="_blank" rel="noopener">WhatsApp</a>
      </div>`;
  }
</script>
</body>
</html>
